services:
  api:
    build:
      context: ../
      dockerfile: src/LatexView.Api/Dockerfile
    env_file: .env
    environment:
      - HTTP_PORTS=8080
    ports:
      - "8080:8080"
    volumes:
      - ${TEXLIVE_DIR}:/texlive
  bot:
    build:
      context: ../
      dockerfile: src/LatexView.Bot/Dockerfile
    env_file: .env
  db:
    profiles: [local]
    image: postgres
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
volumes:
  db-data:
